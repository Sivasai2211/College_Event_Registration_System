<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Event Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎓 College Events</h1>
    <p>Discover events. Register. Participate.</p>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome to Our College Event Portal</h2>
      <p>Explore upcoming events and reserve your place.</p>
    </section>

    <section>
      <h2>Upcoming Events</h2>
      <div id="events" class="event-grid">Loading events...</div>
    </section>

    <section class="panel">
      <h2>Student Registration</h2>
      <form id="regForm">
        <input id="name" placeholder="Student name" required>
        <input id="roll" placeholder="Roll number" required>
        <input id="email" type="email" placeholder="Email address" required>
        <select id="event" required>
          <option value="">Select an event</option>
        </select>
        <button type="submit">Register Now</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="panel">
      <h2>Registered Students</h2>
      <button id="refresh">Refresh List</button>
      <div id="registrations"></div>
    </section>
  </main>

  <footer>College Event Registration System · FSD-II</footer>
  <script src="app.js"></script>
</body>
</html>
